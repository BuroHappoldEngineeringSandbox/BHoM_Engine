name: vars probe
description: Scratch. Does the vars context resolve inside a composite action?
inputs:
  passed:
    description: Value passed in by the calling workflow, as a control.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Read vars in a composite step
      shell: pwsh
      env:
        FROM_ENV: ${{ vars.CURRENT_MILESTONE }}
      run: |
        Write-Host "inline expression: [${{ vars.CURRENT_MILESTONE }}]"
        Write-Host "env mapping:       [$env:FROM_ENV]"
        Write-Host "passed input:      [${{ inputs.passed }}]"
