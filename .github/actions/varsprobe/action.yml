name: vars probe
description: Scratch. Can an org variable reach a composite action without the vars context?
inputs:
  passed:
    description: Value passed in by the calling workflow as an input.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Read the workarounds
      shell: pwsh
      run: |
        Write-Host "passed input:     [${{ inputs.passed }}]"
        Write-Host "inherited env:    [$env:FROM_CALLER_ENV]"
