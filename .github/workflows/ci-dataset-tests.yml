# Sandbox capture harness. Mirrors the ci-dataset-tests job in the beta tier bundle,
# repointed at the sandbox CI_Toolkit copy so the action under test is the one on
# capture/dataset-baseline and not develop's.
#
# windows-latest rather than windows-2025-vs2026: measured as the same image, and it
# removes a queue-forever failure mode if the label is not offered in this org.
name: CI Dataset Tests

on:
  pull_request:

jobs:
  ci-dataset-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Run dataset tests
        uses: BuroHappoldEngineeringSandbox/CI_Toolkit/.github/actions/ci-dataset-tests@capture/dataset-baseline-frozen
        with:
          fallback_token: ${{ github.token }}
