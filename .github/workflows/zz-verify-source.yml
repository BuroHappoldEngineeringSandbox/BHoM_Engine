name: zz-verify-source

# TEMPORARY Sandbox experiment: which Verify methods ci-serialisation runs when BHoM_Engine is the
# repository under test, with the fix (job "fixed") and without it (job "control"). Deleted with
# this branch.

on:
  push:
    branches: [probe/verify-source]
  pull_request:
    branches: [fi/base]

permissions:
  contents: read

jobs:
  fixed:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - name: CI_Toolkit heads at start
        shell: pwsh
        run: |
          git ls-remote https://github.com/BHoM/CI_Toolkit.git refs/heads/develop
          git ls-remote https://github.com/BuroHappoldEngineeringSandbox/CI_Toolkit.git refs/heads/fix/serialisation-verify-source-sandbox

      - name: Run serialisation
        uses: BuroHappoldEngineeringSandbox/CI_Toolkit/.github/actions/ci-serialisation@c39fbc22858d903f59b4c5abac5d28a32e668fec
        with:
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          base_ref: ${{ github.base_ref || 'fi/base' }}
          serialisation_engine_repo: BuroHappoldEngineeringSandbox/BHoM_Engine
          test_toolkit_repo: BuroHappoldEngineeringSandbox/Test_Toolkit@probe/verify-source

      - name: Hash tested DLLs against both builds
        if: always()
        shell: pwsh
        run: |
          # Build output paths are hidden by -clp:ErrorsOnly, so search both trees for every
          # copy of each tested DLL and record which tree holds a byte-identical one.
          $pd    = "$env:ProgramData\BHoM\Assemblies"
          $roots = [ordered]@{ caller = $env:GITHUB_WORKSPACE; seed = "C:\bhom-deps\BHoM_Engine" }
          $index = @{}
          foreach ($k in $roots.Keys) {
            Get-ChildItem $roots[$k] -Recurse -Filter *.dll -File -ErrorAction SilentlyContinue | ForEach-Object {
              $key = "$k|$($_.Name.ToLowerInvariant())"
              if (-not $index.ContainsKey($key)) { $index[$key] = @() }
              $index[$key] += [pscustomobject]@{ Path = $_.FullName; Hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash }
            }
          }
          New-Item -ItemType Directory -Force -Path hashes | Out-Null
          $rows = Get-ChildItem $pd -Filter *.dll | Sort-Object Name | ForEach-Object {
            $t = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $n = $_.Name.ToLowerInvariant()
            $c = @($index["caller|$n"]); $s = @($index["seed|$n"])
            $cm = @($c | Where-Object { $_ -and $_.Hash -eq $t }); $sm = @($s | Where-Object { $_ -and $_.Hash -eq $t })
            $source = if ($cm.Count -and $sm.Count) { "both-identical" } elseif ($cm.Count) { "caller" }
                      elseif ($sm.Count) { "seed" } elseif (-not ($c | Where-Object { $_ }) -and -not ($s | Where-Object { $_ })) { "neither-tree" }
                      else { "unmatched" }
            [pscustomobject]@{ Name = $_.Name; Source = $source
                               CallerCopies = @($c | Where-Object { $_ }).Count; SeedCopies = @($s | Where-Object { $_ }).Count
                               Tested = $t; CallerMatch = ($cm | Select-Object -First 1).Path; SeedMatch = ($sm | Select-Object -First 1).Path
                               Written = $_.LastWriteTimeUtc.ToString("o") }
          }
          $rows | Export-Csv hashes\hashes.csv -NoTypeInformation
          $rows | Group-Object Source | ForEach-Object { "{0}: {1}" -f $_.Name, $_.Count }
          $rows | Where-Object { $_.Name -in 'Serialiser_Test.dll','Engine_Test.dll' } | ForEach-Object { Write-Host ("tested {0}: source={1} caller={2} seed={3}" -f $_.Name, $_.Source, $_.CallerMatch, $_.SeedMatch) }
          Write-Host "event: ${{ github.event_name }} | github.sha: ${{ github.sha }} | PR head: ${{ github.event.pull_request.head.sha }}"
          Write-Host ("caller workspace HEAD: " + (git -C $env:GITHUB_WORKSPACE rev-parse HEAD))
          Write-Host ("seed clone HEAD:       " + (git -C "C:\bhom-deps\BHoM_Engine" log -1 --format="%H %s"))
          # Content check by raw byte search (any offset), on the tested DLL and the seed-built one.
          $probe = [BitConverter]::ToString([Text.Encoding]::Unicode.GetBytes("verify-source probe"))
          $seedDll = Join-Path "C:\bhom-deps\BHoM_Engine" ".ci\code\Serialiser_Test\bin\Release\netstandard2.0\Serialiser_Test.dll"
          foreach ($f in @("$pd\Serialiser_Test.dll", $seedDll)) {
            if (Test-Path $f) {
              $hex = [BitConverter]::ToString([IO.File]::ReadAllBytes($f))
              Write-Host ("probe string present (byte search) in {0}: {1}" -f $f, ($hex.IndexOf($probe) -ge 0))
            } else { Write-Host "not present: $f" }
          }

      - name: Upload hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hashes-fixed
          path: hashes
          retention-days: 14

      - name: CI_Toolkit heads at end
        if: always()
        shell: pwsh
        run: |
          git ls-remote https://github.com/BHoM/CI_Toolkit.git refs/heads/develop
          git ls-remote https://github.com/BuroHappoldEngineeringSandbox/CI_Toolkit.git refs/heads/fix/serialisation-verify-source-sandbox

  control:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - name: CI_Toolkit heads at start
        shell: pwsh
        run: |
          git ls-remote https://github.com/BHoM/CI_Toolkit.git refs/heads/develop
          git ls-remote https://github.com/BuroHappoldEngineeringSandbox/CI_Toolkit.git refs/heads/fix/serialisation-verify-source-sandbox

      - name: Run serialisation
        uses: BHoM/CI_Toolkit/.github/actions/ci-serialisation@38bc7fca1f05f1a366f5b26cf4c28ed4897c79e8
        with:
          app_id: ${{ secrets.BHOM_APP_ID }}
          private_key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}
          base_ref: ${{ github.base_ref || 'fi/base' }}
          serialisation_engine_repo: BuroHappoldEngineeringSandbox/BHoM_Engine
          test_toolkit_repo: BuroHappoldEngineeringSandbox/Test_Toolkit@probe/verify-source

      - name: Hash tested DLLs against both builds
        if: always()
        shell: pwsh
        run: |
          # Build output paths are hidden by -clp:ErrorsOnly, so search both trees for every
          # copy of each tested DLL and record which tree holds a byte-identical one.
          $pd    = "$env:ProgramData\BHoM\Assemblies"
          $roots = [ordered]@{ caller = $env:GITHUB_WORKSPACE; seed = "C:\bhom-deps\BHoM_Engine" }
          $index = @{}
          foreach ($k in $roots.Keys) {
            Get-ChildItem $roots[$k] -Recurse -Filter *.dll -File -ErrorAction SilentlyContinue | ForEach-Object {
              $key = "$k|$($_.Name.ToLowerInvariant())"
              if (-not $index.ContainsKey($key)) { $index[$key] = @() }
              $index[$key] += [pscustomobject]@{ Path = $_.FullName; Hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash }
            }
          }
          New-Item -ItemType Directory -Force -Path hashes | Out-Null
          $rows = Get-ChildItem $pd -Filter *.dll | Sort-Object Name | ForEach-Object {
            $t = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            $n = $_.Name.ToLowerInvariant()
            $c = @($index["caller|$n"]); $s = @($index["seed|$n"])
            $cm = @($c | Where-Object { $_ -and $_.Hash -eq $t }); $sm = @($s | Where-Object { $_ -and $_.Hash -eq $t })
            $source = if ($cm.Count -and $sm.Count) { "both-identical" } elseif ($cm.Count) { "caller" }
                      elseif ($sm.Count) { "seed" } elseif (-not ($c | Where-Object { $_ }) -and -not ($s | Where-Object { $_ })) { "neither-tree" }
                      else { "unmatched" }
            [pscustomobject]@{ Name = $_.Name; Source = $source
                               CallerCopies = @($c | Where-Object { $_ }).Count; SeedCopies = @($s | Where-Object { $_ }).Count
                               Tested = $t; CallerMatch = ($cm | Select-Object -First 1).Path; SeedMatch = ($sm | Select-Object -First 1).Path
                               Written = $_.LastWriteTimeUtc.ToString("o") }
          }
          $rows | Export-Csv hashes\hashes.csv -NoTypeInformation
          $rows | Group-Object Source | ForEach-Object { "{0}: {1}" -f $_.Name, $_.Count }
          $rows | Where-Object { $_.Name -in 'Serialiser_Test.dll','Engine_Test.dll' } | ForEach-Object { Write-Host ("tested {0}: source={1} caller={2} seed={3}" -f $_.Name, $_.Source, $_.CallerMatch, $_.SeedMatch) }
          Write-Host "event: ${{ github.event_name }} | github.sha: ${{ github.sha }} | PR head: ${{ github.event.pull_request.head.sha }}"
          Write-Host ("caller workspace HEAD: " + (git -C $env:GITHUB_WORKSPACE rev-parse HEAD))
          Write-Host ("seed clone HEAD:       " + (git -C "C:\bhom-deps\BHoM_Engine" log -1 --format="%H %s"))
          # Content check by raw byte search (any offset), on the tested DLL and the seed-built one.
          $probe = [BitConverter]::ToString([Text.Encoding]::Unicode.GetBytes("verify-source probe"))
          $seedDll = Join-Path "C:\bhom-deps\BHoM_Engine" ".ci\code\Serialiser_Test\bin\Release\netstandard2.0\Serialiser_Test.dll"
          foreach ($f in @("$pd\Serialiser_Test.dll", $seedDll)) {
            if (Test-Path $f) {
              $hex = [BitConverter]::ToString([IO.File]::ReadAllBytes($f))
              Write-Host ("probe string present (byte search) in {0}: {1}" -f $f, ($hex.IndexOf($probe) -ge 0))
            } else { Write-Host "not present: $f" }
          }

      - name: Upload hashes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hashes-control
          path: hashes
          retention-days: 14

      - name: CI_Toolkit heads at end
        if: always()
        shell: pwsh
        run: |
          git ls-remote https://github.com/BHoM/CI_Toolkit.git refs/heads/develop
          git ls-remote https://github.com/BuroHappoldEngineeringSandbox/CI_Toolkit.git refs/heads/fix/serialisation-verify-source-sandbox

